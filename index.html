<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Seguridad: la página solo puede cargar la app de Google y no envía la dirección (con el código del alumno) a terceros -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https:; frame-src https://script.google.com https://*.googleusercontent.com https://accounts.google.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Cargando…</title>
<!-- abre las conexiones con Google y con la librería de gráficos mientras el navegador lee esta página -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0A1430}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .cargando{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#94A3C8;font:15px "Segoe UI",system-ui,sans-serif;text-align:center;padding:0 24px}
  .cargando img{width:96px;height:96px;object-fit:contain;animation:p 1.4s ease-in-out infinite}
  .cargando b{color:#E8EEFF;letter-spacing:1px;font-size:18px}
  .cargando button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:#3FE0C5;color:#0A1430;cursor:pointer}
  .cargando.error img{animation:none;opacity:.6}
  @keyframes p{50%{opacity:.55;transform:scale(.95)}}
</style>
</head>
<body>
<div class="cargando" id="carga"><img id="logo" alt=""><b id="nombre"></b><span id="estado">Cargando…</span></div>
<script>
  /* Si hay un error de escritura en la configuración, se guarda la línea para mostrarla en pantalla */
  window.__errLinea = 0;
  window.addEventListener('error', function (e) { if (!window.__errLinea) window.__errLinea = e.lineno || -1; });
</script>
<script>
  /* ======================= CONFIGURA AQUÍ ======================= */
  var APP    = 'https://script.google.com/macros/s/AKfycbwZmJbIN_VIVdDqSzz1rBTnvJ9mzUuRid69kwhEWvGv0BSNPmnGkQD713_rdZfZHxwaZw/exec';
  var NOMBRE = 'GYM BASE OVA';
  var LOGO   = '';   // ej.: 'logo.png' si está en este mismo repositorio. Vacío = ícono por defecto
  var FONDO  = '#0A1430';
  var ACENTO = '#3FE0C5';
  /* ============================================================== */
</script>
<script>
  (function () {
    var malConfig = typeof APP === 'undefined';
    if (typeof NOMBRE === 'undefined') window.NOMBRE = '';
    if (typeof LOGO === 'undefined') window.LOGO = '';
    if (typeof FONDO === 'undefined') window.FONDO = '#0A1430';
    if (typeof ACENTO === 'undefined') window.ACENTO = '#3FE0C5';
    if (typeof ACENTO2 === 'undefined') window.ACENTO2 = ACENTO;
    var $ = function (id) { return document.getElementById(id); };
    if (!LOGO) LOGO = 'data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='" + ACENTO + "'/><stop offset='1' stop-color='" + ACENTO2 + "'/></linearGradient></defs><rect width='64' height='64' rx='18' fill='url(#g)'/><path d='M14 27v10M20.5 21v22M43.5 21v22M50 27v10M20.5 32h23' stroke='#0A1430' stroke-width='5.5' stroke-linecap='round'/></svg>");
    document.title = NOMBRE;
    document.body.style.background = FONDO;
    $('logo').src = LOGO; $('nombre').textContent = NOMBRE;
    [['icon', LOGO], ['apple-touch-icon', LOGO]].forEach(function (x) { var l = document.createElement('link'); l.rel = x[0]; l.href = x[1]; document.head.appendChild(l); });
    var tc = document.createElement('meta'); tc.name = 'theme-color'; tc.content = FONDO; document.head.appendChild(tc);

    function aviso(texto, boton) {
      $('carga').className = 'cargando error'; $('estado').textContent = texto;
      if (boton) { var b = document.createElement('button'); b.textContent = 'Reintentar'; b.onclick = function () { location.reload(); }; $('carga').appendChild(b); }
    }
    // 0) error de escritura en "CONFIGURA AQUÍ" (comilla o punto y coma de menos, comillas curvas ‘ ’ “ ”…)
    if (malConfig || window.__errLinea) {
      aviso('Hay un error de escritura en la zona "CONFIGURA AQUÍ" de index.html' + (window.__errLinea > 0 ? ' (línea ' + window.__errLinea + ')' : '') +
        '. Revisa que cada valor esté entre comillas rectas \' \' y que la línea termine en ; — por ejemplo: var APP = \'https://script.google.com/macros/s/…/exec\';');
      return;
    }
    // 1) URL de la app bien configurada (evita el error "El archivo que solicitaste no existe")
    APP = String(APP).trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(APP)) {
      aviso('Falta configurar la dirección de la app: edita index.html y pega en APP la URL que termina en /exec.');
      return;
    }
    // 2) Solo se pasan los parámetros que la app usa, con formato válido
    var q = new URLSearchParams(location.search), c = (q.get('cliente') || '').trim(), extra = '';
    if (c) extra = /^[A-Za-z0-9]{6,20}$/.test(c) ? '?cliente=' + encodeURIComponent(c.toLowerCase()) : '?cliente=x';
    else if (q.has('registro')) extra = '?registro';
    else if (q.has('panel')) extra = '?panel';

    var f = document.createElement('iframe'), listo = false;
    f.title = NOMBRE;
    f.allow = 'clipboard-write';
    f.referrerPolicy = 'no-referrer';
    f.src = APP + extra;
    f.onload = function () { listo = true; var el = $('carga'); if (el) el.remove(); };
    document.body.appendChild(f);
    // 3) Si Google no responde, mensaje claro en vez de una pantalla en blanco
    setTimeout(function () { if (!listo) aviso('La app está tardando más de lo normal. Revisa tu conexión a internet.', true); }, 25000);
  })();
</script>
</body>
</html>
